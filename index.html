<!doctype html>
<html lang="en" class="motion-pending">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Corpse Club — Play After Dark</title>
  <style>
    @font-face {
      font-family: Reference Sans;
      src: url('/fonts/BreulGroteskA-Light.ttf')
    }

    @font-face {
      font-family: Reference Display;
      src: url('/fonts/BreulGroteskA-SemiLight.ttf')
    }

    :root {
      font-family: "Reference Sans", Arial, sans-serif;
      color: #fff;
      background: #000;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000
    }

    button,
    a {
      color: inherit;
      font: inherit
    }

    button {
      cursor: pointer
    }

    a {
      text-decoration: none
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px
    }

    .viewport {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #000
    }

    .screen {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      background: #000;
      overflow: hidden;
      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --card-width: clamp(150px, 18.96vh, 215px)
    }

    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
      filter: saturate(.78) contrast(1.09) brightness(.69)
    }

    .screen:before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(180deg, rgba(0, 0, 0, .06), transparent 24%, transparent 82%, rgba(0, 0, 0, .2)), radial-gradient(ellipse at 44% 54%, transparent 25%, rgba(0, 0, 0, .42) 100%)
    }

    .screen:after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .25;
      background-image: linear-gradient(115deg, transparent 0 48%, rgba(243, 52, 35, .14) 48.1%, transparent 48.35%), radial-gradient(rgba(255, 255, 255, .28) .5px, transparent .6px);
      background-size: auto, 5px 5px;
      mix-blend-mode: screen
    }

    .header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 3
    }

    .brand {
      position: relative;
      top: 10px;
      width: 25px;
      height: 25px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3))
    }

    .brand svg {
      display: block;
      width: 100%;
      height: 100%
    }

    .header-actions {
      display: flex;
      align-items: flex-start;
      flex: 1
    }

    .nav {
      display: flex;
      position: relative;
      top: 9px;
      margin-left: clamp(36px, 3.03vw, 48px);
      gap: clamp(32px, 2.9vw, 43px)
    }

    .nav a {
      position: relative;
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229, 229, 230, .77);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .55)
    }

    .nav a:first-child {
      top: -3px;
      color: #fff
    }

    .nav a:first-child:after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -9px;
      width: 44px;
      height: 2px;
      background: rgba(243, 52, 35, .95);
      box-shadow: 0 0 10px rgba(243, 52, 35, .72)
    }

    .nav a:nth-child(4) {
      margin-left: 1px
    }

    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230, 230, 230, .52);
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .55)
    }

    .time-panel label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240, 240, 240, .77)
    }

    .time-panel strong {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255, 255, 255, .93)
    }

    .sign-up {
      height: 42px;
      width: 109px;
      margin-left: clamp(20px, 1.95vw, 29px);
      border: 0;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-weight: 460;
      letter-spacing: -.34px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), 0 1px 5px rgba(0, 0, 0, .34)
    }

    .menu-toggle {
      display: none
    }

    .hero {
      position: absolute;
      inset: 0
    }

    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 2
    }

    .hero-title {
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-weight: 500;
      font-optical-sizing: auto;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      letter-spacing: -2.1px;
      -webkit-text-stroke: .12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .44);
      margin: 0
    }

    .line {
      display: block;
      overflow: hidden;
      transform-origin: left center
    }

    .line-one {
      color: #fff;
      transform: scaleX(.775)
    }

    .line-two {
      color: rgba(211, 207, 207, .78);
      transform: scaleX(.793)
    }

    .line-reveal {
      display: block
    }

    .hero-copy {
      position: relative;
      left: 1px;
      margin: var(--title-copy-gap) 0 0;
      width: clamp(390px, 31.67vw, 500px);
      font-size: var(--copy-size);
      font-weight: 350;
      letter-spacing: .13px;
      line-height: var(--copy-leading);
      color: rgba(226, 229, 228, .84);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7)
    }

    .primary-cta {
      position: relative;
      width: var(--cta-width);
      height: var(--cta-height);
      margin-top: var(--copy-cta-gap);
      border: 0;
      border-radius: 7px;
      background: #fff;
      color: #111;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .38);
      font-weight: 450;
      letter-spacing: -.3px;
      text-align: left
    }

    .primary-cta .label {
      position: absolute;
      left: 8.125%;
      top: 50%;
      transform: translateY(-50%)
    }

    .arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: grid;
      place-items: center;
      color: #fff
    }

    .arrow-box svg {
      width: 14px;
      height: 14px
    }

    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201/265;
      container-type: inline-size;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(20, 35, 36, .82), rgba(5, 9, 12, .9));
      box-shadow: 0 2px 10px rgba(0, 0, 0, .44), 0 0 0 3px rgba(255, 255, 255, .035) inset, 0 0 0 1px rgba(0, 0, 0, .9);
      backdrop-filter: blur(14px) saturate(108%);
      overflow: hidden;
      z-index: 2
    }

    .demo-card:before {
      content: "ARENA FEED";
      position: absolute;
      z-index: 2;
      top: 8cqw;
      left: 9cqw;
      font-size: 6.4cqw;
      letter-spacing: .11em;
      color: #fff;
      text-shadow: 0 1px 4px #000
    }

    .demo-visual {
      position: absolute;
      left: 3.5cqw;
      top: 4cqw;
      width: 92.5cqw;
      height: 92cqw;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden
    }

    .demo-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.74) saturate(1.18) contrast(1.08);
      transform: scale(1.08)
    }

    .demo-visual:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(231, 32, 25, .36), transparent 48%, rgba(0, 169, 175, .27))
    }

    .play {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: 29cqw;
      height: 29cqw;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 50%;
      background: rgba(3, 5, 7, .47);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center
    }

    .play svg {
      width: 32%;
      margin-left: 8%;
      fill: #fff
    }

    .watch-button {
      position: absolute;
      left: 7cqw;
      bottom: 7cqw;
      width: 86cqw;
      height: 19cqw;
      border: 1px solid rgba(255, 255, 255, .21);
      border-radius: 3.5cqw;
      background: linear-gradient(145deg, rgba(26, 34, 36, .86), rgba(16, 29, 33, .9));
      color: #fff;
      font-size: 8.2cqw;
      font-weight: 430;
      letter-spacing: -.12px;
      backdrop-filter: blur(12px)
    }

    .watch-button span {
      color: #f33423;
      margin-left: 6cqw
    }

    .motion-pending .brand {
      opacity: 0
    }

    .motion-pending .nav a,
    .motion-pending .time-panel,
    .motion-pending .sign-up,
    .motion-pending .hero-copy,
    .motion-pending .primary-cta,
    .motion-pending .demo-card,
    .motion-pending .menu-toggle {
      opacity: 0
    }

    .motion-pending .line-reveal {
      transform: translate3d(0, 110%, 0) skewY(2deg)
    }

    .motion-pending .hero-copy {
      transform: translateY(10px)

    .motion-pending .primary-cta {

    .motion-pending .brand {
      animation: entrance-brand 580ms cubic-bezier(.16, 1, .3, 1) 60ms forwards
    }

    .motion-pending .nav a:nth-child(1) {
      animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 130ms forwards
    }

    .motion-pending .nav a:nth-child(2) {
      animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 175ms forwards
    }

    .motion-pending .nav a:nth-child(3) {
      animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 220ms forwards
    }

    .motion-pending .nav a:nth-child(4) {
      animation: entrance-nav 480ms cubic-bezier(.16, 1, .3, 1) 265ms forwards
    }

    .motion-pending .time-panel {
      animation: entrance-nav 520ms cubic-bezier(.16, 1, .3, 1) 180ms forwards
    }

    }

      animation: entrance-copy 620ms cubic-bezier(.16, 1, .3, 1) 740ms forwards
    }

    .motion-pending .primary-cta {
      animation: entrance-action 560ms cubic-bezier(.16, 1, .3, 1) 960ms forwards
    }

    .motion-pending .demo-card {
      animation: entrance-card 920ms cubic-bezier(.22, 1, .36, 1) 1040ms forwards
    }

    @keyframes entrance-brand {
      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    @keyframes entrance-nav {
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes entrance-action {
      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    @keyframes entrance-line {
      to {
        transform: translate3d(0, 0, 0) skewY(0)
      }
    }

    @keyframes entrance-copy {
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes entrance-card {
      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    @media(hover:hover) {

      button,
      a {
        transition: filter 140ms, opacity 140ms
      }

      button:hover,
      a:hover {
        filter: brightness(1.08)
      }
    }

    @media (min-width:620px) and (max-width:790px),
    (min-width:620px) and (max-width:1100px) and (orientation:portrait) {

<body>
  <main class="viewport">
    <section class="screen" id="screen">
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">
        <source src="/video/IMG_5786.MP4" type="video/mp4">
      </video>
      <header class="header">
        <a class="brand" href="#" aria-label="Corpse Club home"><svg viewBox="0 0 25 25" aria-hidden="true">
            <defs>
              <clipPath id="clip">
                <circle cx="12.5" cy="12.5" r="12.5" />
              </clipPath>
            </defs>
            <g clip-path="url(#clip)">
              <rect width="25" height="25" fill="#ededed" />
              <path d="M0 4 13 0 9 13z" fill="#050606" />
              <path d="m25 5-10 5 4 15z" fill="#737778" />
              <path d="m5 25 7-12 8 5z" fill="#fafafa" />
              <path d="m0 19 9-6 10 12z" fill="#0a0b0b" />
            </g>
          </svg></a>
        <div class="header-actions" id="tablet-navigation">
          <nav class="nav"><a href="#">Lounge</a><a href="#">Pods</a><a href="#">Library</a><a href="#">Contact</a>
          </nav>
          <div class="time-panel"><label>Next drop</label><strong>7:20 PM&nbsp; • &nbsp;Tonight</strong></div><button
            class="sign-up">Book now</button>
        </div>
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"></button>
      </header>
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title"><span class="line line-one"><span class="line-reveal">PLAY AFTER</span></span><span
              class="line line-two"><span class="line-reveal">DARK.</span></span></h1>
          <p class="hero-copy">The lights are low. The frames are high.<br>Corpse Club turns every session into a
            proper<br>night out — no queues, no filler, all game.</p><a class="primary-cta" href="/book"><span
              class="label">Book a pod</span><span class="arrow-box"><svg viewBox="0 0 14 14" fill="none">
                <path d="M3 11 11 3M4 3h7v7" stroke="currentColor" stroke-width="1.35" />
              </svg></span></a>
        </div>
        <article class="demo-card">
          <div class="demo-visual"><img src="/assets/match-hero-text.png" alt="Neon-lit gaming arena"><button
              class="play" aria-label="Play demo"><svg viewBox="0 0 20 20">
                <path d="m6 4 10 6-10 6V4Z" />
              </svg></button></div><button class="watch-button">Enter arena <span>↗</span></button>
        </article>
      </section>
    </section>
  </main>
  <script>
    const header = document.querySelector('.header'), menu = document.querySelector('.menu-toggle'), navigation = document.querySelector('#tablet-navigation'), card = document.querySelector('.demo-card');
    function closeMenu() { header.classList.remove('menu-open'); menu.setAttribute('aria-expanded', 'false'); menu.setAttribute('aria-label', 'Open menu'); navigation.inert = true }
    function openMenu() { header.classList.add('menu-open'); menu.setAttribute('aria-expanded', 'true'); menu.setAttribute('aria-label', 'Close menu'); navigation.inert = false; navigation.querySelector('a').focus() }
    function visibleMenu() { return getComputedStyle(menu).display !== 'none' }
    menu.addEventListener('click', () => header.classList.contains('menu-open') ? closeMenu() : openMenu()); document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu() }); document.addEventListener('pointerdown', e => { if (visibleMenu() && !header.contains(e.target)) closeMenu() }); navigation.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
    function menuState() { navigation.inert = visibleMenu() && !header.classList.contains('menu-open') } menuState(); addEventListener('resize', menuState);
    card.addEventListener('animationend', () => { document.documentElement.classList.remove('motion-pending'); clearTimeout(window.__motionTimeout) }, { once: true });
  </script>
